<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廁所報修系統</title>
<style>
    *{
        box-sizing:border-box;
        margin:0;
        padding:0;
        font-family:"Microsoft JhengHei",sans-serif;
    }
    body{
        background:#f4f4f4;
        padding:20px;
        height:100vh;
    }
    .container{
        height:100%;
        display:flex;
        flex-direction:column;
        gap:20px;
    }
    /* 上方1/4 */
    .top-section{
        background:white;
        border-radius:10px;
        padding:20px;
        height:25%;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    .form-grid{
        display:grid;
        grid-template-columns: repeat(4, 1fr);
        gap:15px;
        margin-bottom:15px;
    }
    .form-group{
        display:flex;
        flex-direction:column;
    }
    label{
        margin-bottom:5px;
        font-weight:bold;
    }
    select,
    input,
    textarea{
        padding:10px;
        border:1px solid #ccc;
        border-radius:5px;
        font-size:14px;
    }
    textarea{
        resize:none;
        height:80px;
    }
    .button-area{
        display:flex;
        justify-content:flex-end;
    }
    button{
        padding:10px 20px;
        border:none;
        background:#007bff;
        color:white;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }
    button:hover{
        background:#0056b3;
    }
    /* 下方3/4 */
    .bottom-section{
        background:white;
        border-radius:10px;
        padding:20px;
        height:75%;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        overflow:auto;
    }
    .filter-area{
        margin-bottom:20px;
        display:flex;
        gap:10px;
        align-items:center;
    }
    table{
        width:100%;
        border-collapse:collapse;
    }
    th, td{
        border:1px solid #ddd;
        padding:12px;
        text-align:left;
    }
    th{
        background:#007bff;
        color:white;
    }
    tr:nth-child(even){
        background:#f9f9f9;
    }
    .hidden{
        display:none;
    }
    @media(max-width:1000px){
        .top-section{
            height:auto;
        }
        .bottom-section{
            height:auto;
        }
        .form-grid{
            grid-template-columns:1fr;
        }
    }
</style>
</head>
<body>
<div class="container">
    <!-- 上方區塊 -->
    <div class="top-section">
        <div class="form-grid">
            <!-- 區域 -->
            <div class="form-group">
                <label>區域</label>
                <select id="area">
                    <option value="">請選擇</option>
                    <option>B2內野</option>
                    <option>B2外野</option>
                    <option>B1一壘側</option>
                    <option>B1三壘側</option>
                    <option>B1外野</option>
                    <option>二樓一壘側</option>
                    <option>二樓三壘側</option>
                    <option>三樓一壘側</option>
                    <option>三樓三壘側</option>
                    <option>三樓包廂</option>
                    <option>三樓外野</option>
                    <option>四樓一壘側</option>
                    <option>四樓三壘側</option>
                </select>
            </div>
            <!-- 報修號碼 -->
            <div class="form-group">
                <label>報修號碼</label>
                <input type="text" id="repairNo" placeholder="請輸入英文或數字">
            </div>
            <!-- 第一層 -->
            <div class="form-group">
                <label>報修類型</label>
                <select id="mainCategory">
                    <option value="">請選擇</option>
                    <option value="馬桶相關">馬桶相關</option>
                    <option value="小便斗相關">小便斗相關</option>
                    <option value="電燈相關">電燈相關</option>
                    <option value="洗手台相關">洗手台相關</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <!-- 第二層 -->
            <div class="form-group">
                <label>報修內容</label>
                <select id="subCategory">
                    <option value="">請先選擇類型</option>
                </select>
                <input 
                    type="text" 
                    id="otherInput" 
                    class="hidden"
                    placeholder="請輸入其他內容">
            </div>
        </div>
        <!-- 備註 -->
        <div class="form-group">
            <label>備註</label>
            <textarea id="note" placeholder="請輸入備註"></textarea>
        </div>
        <br>
        <div class="button-area">
            <button onclick="submitRepair()">送出報修</button>
        </div>
    </div>
    <!-- 下方區塊 -->
    <div class="bottom-section">
        <div class="filter-area">
            <label>篩選區域：</label>
            <select id="filterArea" onchange="renderTable()">
                <option value="">全部</option>
                <option>B2內野</option>
                <option>B2外野</option>
                <option>B1一壘側</option>
                <option>B1三壘側</option>
                <option>B1外野</option>
                <option>二樓一壘側</option>
                <option>二樓三壘側</option>
                <option>三樓一壘側</option>
                <option>三樓三壘側</option>
                <option>三樓包廂</option>
                <option>三樓外野</option>
                <option>四樓一壘側</option>
                <option>四樓三壘側</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>時間</th>
                    <th>區域</th>
                    <th>報修號碼</th>
                    <th>報修內容</th>
                    <th>備註</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
<script>
const categoryData = {
    "馬桶相關": ["無法沖水", "堵塞", "歪斜"],
    "小便斗相關": ["嗶嗶叫", "堵塞", "漏水"],
    "電燈相關": ["電燈不亮"],
    "洗手台相關": ["無法沖水"]
};
const mainCategory = document.getElementById("mainCategory");
const subCategory = document.getElementById("subCategory");
const otherInput = document.getElementById("otherInput");
mainCategory.addEventListener("change", function(){
    const value = this.value;
    subCategory.innerHTML = "";
    if(value === "其他"){
        subCategory.classList.add("hidden");
        otherInput.classList.remove("hidden");
    }else{
        otherInput.classList.add("hidden");
        subCategory.classList.remove("hidden");
        const defaultOption = document.createElement("option");
        defaultOption.text = "請選擇";
        defaultOption.value = "";
        subCategory.appendChild(defaultOption);
        if(categoryData[value]){
            categoryData[value].forEach(item=>{
                const option = document.createElement("option");
                option.value = item;
                option.text = item;
                subCategory.appendChild(option);
            });
        }
    }
});
function getTodayDate(){
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,"0");
    const dd = String(today.getDate()).padStart(2,"0");
    return `${yyyy}.${mm}.${dd}`;
}
function submitRepair(){
    const area = document.getElementById("area").value;
    const repairNo = document.getElementById("repairNo").value;
    const main = mainCategory.value;
    const sub = subCategory.value;
    const other = otherInput.value;
    const note = document.getElementById("note").value;
    if(!area || !repairNo || !main){
        alert("請完整填寫資料");
        return;
    }
    let repairContent = "";
    if(main === "其他"){
        if(!other){
            alert("請輸入其他內容");
            return;
        }
        repairContent = `其他 / ${other}`;
    }else{
        if(!sub){
            alert("請選擇報修內容");
            return;
        }
        repairContent = `${main} / ${sub}`;
    }
    const repairData = {
        date:getTodayDate(),
        area,
        repairNo,
        repairContent,
        note
    };
    let data = JSON.parse(localStorage.getItem("repairData")) || [];
    data.push(repairData);
    localStorage.setItem("repairData", JSON.stringify(data));
    clearForm();
    renderTable();
    alert("報修新增成功！");
}
function clearForm(){
    document.getElementById("area").value = "";
    document.getElementById("repairNo").value = "";
    document.getElementById("note").value = "";
    mainCategory.value = "";
    subCategory.innerHTML = `
        <option value="">請先選擇類型</option>
    `;
    otherInput.value = "";
    otherInput.classList.add("hidden");
    subCategory.classList.remove("hidden");
}
function renderTable(){
    const tableBody = document.getElementById("tableBody");
    const filterArea = document.getElementById("filterArea").value;
    let data = JSON.parse(localStorage.getItem("repairData")) || [];
    if(filterArea){
        data = data.filter(item=>item.area === filterArea);
    }
    tableBody.innerHTML = "";
    data.forEach(item=>{
        const row = `
            <tr>
                <td>${item.date}</td>
                <td>${item.area}</td>
                <td>${item.repairNo}</td>
                <td>${item.repairContent}</td>
                <td>${item.note}</td>
            </tr>
        `;
        tableBody.innerHTML += row;
    });
}
renderTable();
</script>
</body>
</html>
